name: Test

# Runs the official test command (scripts/test.sh) on a GitHub-hosted Mac for every push,
# so the Mac targets (DictationMac, DictationApp) build and their tests run in the cloud.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build app
        run: scripts/build-app.sh

  signing:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Stable signing identity across rebuilds
        run: scripts/ci-signing-check.sh
